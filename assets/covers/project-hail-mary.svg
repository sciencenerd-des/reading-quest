<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-labelledby="t">
  <title id="t">Project Hail Mary: original artwork, a lone ship near a dimming star with a five-legged friend</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#060918"/><stop offset=".55" stop-color="#140f2e"/><stop offset="1" stop-color="#2a1328"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".9"/><stop offset=".25" stop-color="#e8743a" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#8a2f3a" stop-opacity=".18"/><stop offset="1" stop-color="#8a2f3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff1d0"/><stop offset=".5" stop-color="#f3a35a"/><stop offset="1" stop-color="#b8462e"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f" stop-opacity="0"/><stop offset=".45" stop-color="#05060f" stop-opacity=".85"/><stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f63"/><stop offset="1" stop-color="#0d0f22"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#e9e4ff">
    <circle cx="22" cy="40" r=".9"/><circle cx="58" cy="92" r="1.2" opacity=".7"/><circle cx="96" cy="30" r=".7"/><circle cx="130" cy="70" r="1"/>
    <circle cx="40" cy="160" r=".8" opacity=".6"/><circle cx="18" cy="230" r="1.1"/><circle cx="72" cy="205" r=".6"/><circle cx="110" cy="150" r=".8" opacity=".5"/>
    <circle cx="270" cy="260" r=".9"/><circle cx="246" cy="300" r=".6" opacity=".6"/><circle cx="284" cy="200" r="1.2" opacity=".8"/><circle cx="160" cy="300" r=".7"/>
    <circle cx="200" cy="330" r=".9" opacity=".6"/><circle cx="34" cy="320" r=".7"/><circle cx="125" cy="345" r="1" opacity=".5"/><circle cx="276" cy="36" r=".8"/>
    <circle cx="180" cy="22" r=".6"/><circle cx="12" cy="120" r=".6"/><circle cx="88" cy="268" r="1.1" opacity=".7"/><circle cx="226" cy="236" r=".7" opacity=".7"/>
  </g>
  <!-- the dimming star -->
  <circle cx="212" cy="118" r="130" fill="url(#glow)"/>
  <circle cx="212" cy="118" r="36" fill="url(#core)"/>
  <!-- astrophage blight: dark mottling eating the light -->
  <g fill="#5a1a22" opacity=".32">
    <ellipse cx="200" cy="108" rx="14" ry="8" transform="rotate(-20 200 108)"/>
    <ellipse cx="226" cy="132" rx="10" ry="6" transform="rotate(30 226 132)"/>
    <circle cx="222" cy="100" r="5"/><circle cx="198" cy="132" r="4"/>
  </g>
  <!-- the Petrova line: a faint red thread leaving the star -->
  <path d="M190 140 C150 190 110 230 40 300" stroke="#e05a4a" stroke-width="1.2" fill="none" stroke-opacity=".45" stroke-dasharray="1 4" stroke-linecap="round"/>
  <!-- the ship -->
  <g transform="translate(128 228) rotate(-24)">
    <rect x="-52" y="-7" width="96" height="14" rx="3" fill="url(#hull)" stroke="#f2b14c" stroke-opacity=".55" stroke-width=".8"/>
    <path d="M44 -7 L64 0 L44 7 Z" fill="#2c3152" stroke="#f2b14c" stroke-opacity=".55" stroke-width=".8"/>
    <ellipse cx="-6" cy="0" rx="6" ry="22" fill="none" stroke="#c9c6e8" stroke-opacity=".75" stroke-width="2"/>
    <rect x="-14" y="-24" width="16" height="5" rx="1.5" fill="#1b1f3a" stroke="#c9c6e8" stroke-opacity=".5" stroke-width=".6"/>
    <rect x="-14" y="19" width="16" height="5" rx="1.5" fill="#1b1f3a" stroke="#c9c6e8" stroke-opacity=".5" stroke-width=".6"/>
    <circle cx="30" cy="0" r="2" fill="#ffd28a"/>
    <path d="M-52 -5 L-70 -9 L-70 9 L-52 5 Z" fill="#14172c"/>
    <path d="M-70 -6 L-110 0 L-70 6 Z" fill="#7fd6ff" opacity=".55"/>
    <path d="M-70 -3 L-92 0 L-70 3 Z" fill="#e9fbff" opacity=".8"/>
  </g>
  <!-- a five-legged friend, drifting -->
  <g transform="translate(70 312) rotate(12)" stroke="#c9a98a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 -6 L-10 -18 L-20 -14"/>
    <path d="M6 -4 L14 -18 L24 -18"/>
    <path d="M7 4 L20 8 L24 20"/>
    <path d="M-1 7 L-2 20 L-10 28"/>
    <path d="M-7 2 L-20 4 L-26 14"/>
    <path d="M0 -10 L9.5 -3 L6 8 L-6 8 L-9.5 -3 Z" fill="#8a7058" stroke="#d9bc9a" stroke-width="1.2"/>
  </g>
  <rect y="330" width="300" height="120" fill="url(#fade)"/>
  <rect x="10" y="10" width="280" height="430" rx="4" fill="none" stroke="#f2d7a0" stroke-opacity=".32"/>
  <text x="150" y="388" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="2" fill="#f4ead7">PROJECT</text>
  <text x="150" y="414" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="2" fill="#f4ead7">HAIL MARY</text>
  <text x="150" y="432" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="4" fill="#f2b14c">ANDY WEIR</text>
</svg>
